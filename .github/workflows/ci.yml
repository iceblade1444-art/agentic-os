name: Agentic OS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Deliberately not a dependency of the jobs below: a missing version bump and
  # a failing test are different problems, and finding one should not hide the
  # other. This answers in seconds.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # The check compares two refs, which the default single-commit clone
          # cannot do.
          fetch-depth: 0
      - name: A change that reaches production must move the version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Fetched by name rather than assumed: on a pull_request the
            # checkout is the merge ref, and whether it leaves a usable
            # origin/<base> behind is an implementation detail of the action.
            git fetch -q origin \
              "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
            # All-zeros on a branch's first push, and a force-push can name a
            # sha that is no longer reachable. Either way the previous commit
            # is the honest comparison.
            case "$base" in
              0000000000000000000000000000000000000000|"") base="HEAD~1" ;;
              *) git cat-file -e "$base^{commit}" 2>/dev/null || base="HEAD~1" ;;
            esac
          fi
          node scripts/check-version-bump.mjs "$base"

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev
      - run: python3 -m py_compile scripts/agentic-os-operations.py
      - run: bash -n scripts/install-agentic-os-operations.sh deploy.sh
      - name: Exercise operations backup
        run: |
          root="$(mktemp -d)"
          mkdir -p "$root/app/data" "$root/app/vault" "$root/app/agentos-runtime/logs"
          printf '{}\n' > "$root/app/data/db.json"
          printf '# test\n' > "$root/app/vault/test.md"
          HOME="$root" OPS_STATE_DIR="$root/state" OPS_BACKUP_DIR="$root/backups" \
            python3 scripts/agentic-os-operations.py backup --root "$root/app"
          test -f "$root/state/operations.json"
          test -n "$(find "$root/backups" -name manifest.json -print -quit)"

      - name: Exercise encrypted off-site backup
        run: |
          root="$(mktemp -d)"
          mkdir -p "$root/app/data" "$root/app/vault" "$root/remote"
          printf 'CANARY_SECRET=must-not-appear-in-ciphertext\n' > "$root/app/.env"
          printf '{}\n' > "$root/app/data/db.json"
          printf '# test\n' > "$root/app/vault/test.md"
          printf 'correct horse battery staple\n' > "$root/pass"
          chmod 600 "$root/pass"

          HOME="$root" OPS_STATE_DIR="$root/state" OPS_BACKUP_DIR="$root/backups" \
            OPS_BACKUP_PASSPHRASE_FILE="$root/pass" OPS_BACKUP_REMOTE="$root/remote" \
            python3 scripts/agentic-os-operations.py backup --root "$root/app"

          python3 - "$root" <<'PY'
          import json, sys
          state = json.load(open(f"{sys.argv[1]}/state/operations.json"))
          assert state["backup"]["status"] == "success", state["backup"]
          assert state["offsite"]["status"] == "success", state["offsite"]
          PY

          sealed="$(find "$root/remote" -name '*.tar.gz.gpg' -print -quit)"
          test -n "$sealed"
          # The credential in .env must not be readable in the shipped archive.
          ! grep -q "must-not-appear-in-ciphertext" "$sealed"
          # And the archive must actually restore.
          gpg --batch --quiet --decrypt --passphrase-file "$root/pass" "$sealed" > "$root/out.tar.gz"
          tar -xzf "$root/out.tar.gz" -C "$root"
          grep -rq "must-not-appear-in-ciphertext" "$root"/2*/.env

      - name: An off-site remote without a passphrase is refused
        run: |
          root="$(mktemp -d)"
          mkdir -p "$root/app/data" "$root/remote"
          printf '{}\n' > "$root/app/data/db.json"
          HOME="$root" OPS_STATE_DIR="$root/state" OPS_BACKUP_DIR="$root/backups" \
            OPS_BACKUP_REMOTE="$root/remote" \
            python3 scripts/agentic-os-operations.py backup --root "$root/app"
          # The local backup still succeeds; only the off-site step refuses.
          python3 - "$root" <<'PY'
          import json, sys
          state = json.load(open(f"{sys.argv[1]}/state/operations.json"))
          assert state["backup"]["status"] == "success", state["backup"]
          assert state["offsite"]["status"] == "error", state["offsite"]
          PY
          test -z "$(find "$root/remote" -type f -print -quit)"

  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agentos-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: cp .env.example .env
      - run: python -m pytest -q

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag agentic-os:ci .

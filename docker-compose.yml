# Agentic OS — production compose. Build + run the full app (SPA + backend) in one container.
#   docker compose up -d --build
services:
  agentic-os:
    build: .
    image: agentic-os:latest
    container_name: agentic-os
    restart: unless-stopped
    env_file:
      - .env                # copy .env.example → .env first
    environment:
      - PORT=8787
      - DATA_DIR=/app/data
      - OBSIDIAN_VAULT=/app/vault
    ports:
      # Keep localhost for a proxy on this host. Set BIND_ADDRESS to the server's
      # private/LAN IP when the reverse proxy runs on another machine.
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-8787}:8787"
    volumes:
      - ./data:/app/data        # persists db.json (missions, MCP servers, integrations)
      - ./vault:/app/vault      # your Obsidian vault — change ./vault to your real vault path

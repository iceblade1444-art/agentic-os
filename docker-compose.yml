# Agentic OS — production compose. Build + run the full app (SPA + backend) in one container.
#   docker compose up -d --build
services:
  agentic-os:
    build: .
    image: agentic-os:latest
    container_name: agentic-os
    restart: unless-stopped
    env_file:
      - .env                # copy .env.example → .env first
    environment:
      - PORT=8787
      - DATA_DIR=/app/data
      - OBSIDIAN_VAULT=/app/vault
      - AGENTOS_RUNTIME_URL=http://agentos-runtime:8765
      - HERMES_DASHBOARD_SOCKET=/run/agentic-os/hermes-dashboard.sock
    ports:
      # Keep localhost for a proxy on this host. Set BIND_ADDRESS to the server's
      # private/LAN IP when the reverse proxy runs on another machine.
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-8787}:8787"
    volumes:
      - ./data:/app/data        # persists db.json (missions, MCP servers, integrations)
      - ./vault:/app/vault      # your Obsidian vault — change ./vault to your real vault path
      - ./agentos-runtime/work:/app/work
      - ./agentos-runtime/projects:/app/projects
      - ${CLAUDE_CONFIG_DIR:-/home/admilana/.claude}:/root/.claude
      - ${CLAUDE_CONFIG_FILE:-/home/admilana/.claude.json}:/root/.claude.json
      - /home/admilana/.local/state/agentic-os:/run/agentic-os
    depends_on:
      - agentos-runtime

  agentos-runtime:
    build:
      context: ./agentos-runtime
    image: agentos-runtime:latest
    container_name: agentos-runtime
    restart: unless-stopped
    user: "1000:1000"
    env_file:
      - ./agentos-runtime/.env
    environment:
      - HOME=/home/admilana
      - OBSIDIAN_VAULT_PATH=/app/obsidian-vault
      - PATH=/home/admilana/.local/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
    ports:
      - "${RUNTIME_BIND_ADDRESS:-127.0.0.1}:${RUNTIME_HOST_PORT:-8765}:8765"
    volumes:
      - ./vault:/app/obsidian-vault
      - ./agentos-runtime/agents:/app/agents
      - ./agentos-runtime/approvals:/app/approvals
      - ./agentos-runtime/artifacts:/app/artifacts
      - ./agentos-runtime/drafts:/app/drafts
      - ./agentos-runtime/exports:/app/exports
      - ./agentos-runtime/logs:/app/logs
      - ./agentos-runtime/memory:/app/memory
      - ./agentos-runtime/projects:/app/projects
      - ./agentos-runtime/work:/app/work
      - /home/admilana/.hermes:/home/admilana/.hermes
      - /home/admilana/.local/share/uv:/home/admilana/.local/share/uv:ro
      - /home/admilana/.local/bin/hermes:/home/admilana/.local/bin/hermes:ro
